<!doctype html>
<html lang="es" data-theme="light">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Sin indexar a propósito: la web solo la ve quien tenga el enlace. Para que salga en Google, borra esta línea. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0c16" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css?v=202611161256">
  <!-- Tema e idioma antes de pintar, para que no parpadee -->
  <script>
    (function () {
      var d = document.documentElement, s = {}, q = new URLSearchParams(location.search);
      try { s.t = localStorage.getItem("theme"); s.l = localStorage.getItem("lang"); } catch (e) {}
      var t = q.get("theme"), l = q.get("lang");
      if (t !== "light" && t !== "dark") t = s.t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      if (l !== "es" && l !== "en") l = s.l || ((navigator.language || "es").slice(0, 2) === "en" ? "en" : "es");
      d.setAttribute("data-theme", t);
      d.setAttribute("lang", l);
    })();
  </script>
  <title>Amanda Bautista, Project Manager</title>
  <meta name="description" content="Project Manager en tecnología e innovación. Decido qué se construye y qué se queda fuera, y lo construyo con IA.">
</head>
